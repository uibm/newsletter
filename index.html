<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A daily digest of recent issues and pull requests across tracked GitHub repositories.">
  <meta name="color-scheme" content="light dark">
  <title>GitHub Newsletter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%AC%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="page-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">📬</span>
        <div>
          <h1>GitHub Newsletter</h1>
          <p class="subtitle">Fresh issues &amp; pull requests, auto-updated daily.</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z"/>
          </svg>
          <input id="search" type="search" placeholder="Filter by repo, title, author…" aria-label="Filter items">
        </div>

        <div class="theme-switcher" role="radiogroup" aria-label="Theme">
          <button class="theme-btn" data-theme-value="light" role="radio" aria-checked="true" title="Light mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span class="sr-only">Light</span>
          </button>
          <button class="theme-btn" data-theme-value="dark" role="radio" aria-checked="false" title="Dark mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <span class="sr-only">Dark</span>
          </button>
          <button class="theme-btn" data-theme-value="colorful" role="radio" aria-checked="false" title="Colorful mode">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 3a9 9 0 0 1 0 18z" opacity=".55"/></svg>
            <span class="sr-only">Colorful</span>
          </button>
        </div>
      </div>
    </div>

    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab is-active" role="tab" data-target="issues" aria-selected="true">
        <span class="tab-dot tab-dot-issue"></span> Issues
        <span class="tab-count" id="issues-count">0</span>
      </button>
      <button class="tab" role="tab" data-target="prs" aria-selected="false">
        <span class="tab-dot tab-dot-pr"></span> Pull Requests
        <span class="tab-count" id="prs-count">0</span>
      </button>
    </nav>
  </header>

  <main>
    <section id="issues" class="panel is-active" aria-label="Recent issues"></section>
    <section id="prs" class="panel" aria-label="Recent pull requests" hidden></section>
  </main>

  <footer class="page-footer">
    <p>Built with <span class="heart" aria-hidden="true">♥</span> · Updated daily via GitHub Actions</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
